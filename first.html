<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click to Borrow</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 400px;
            padding: 2rem;
            text-align: center;
        }

        .card h1 {
            font-weight: 600;
            color: #3655b3;
            margin-bottom: 0.5rem;
        }

        .card h2 {
            font-weight: 400;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .card .subtitle {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 1rem;
        }

        .btn {
            font-family: 'Poppins', sans-serif;
            width: 90%;
            padding: 0.75rem;
            margin: 0.5rem auto;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .student-btn {
            text-decoration: none;
            background-color: #3655b3;
            color: white;
        }

        .itso-btn {
            text-decoration: none;
            background-color: white;
            color: #3655b3;
            border: 2px solid #3655b3;
        }

        .btn:hover {
            background-color: black;
            opacity: 0.9;
            transition: 0.4s ease;
        }

        .itso-btn:hover {
            color: white;
            background-color: black;
            opacity: 0.9;
            transition: 0.4s ease;
        }

        .login-text {
            font-size: 0.85rem;
            color: #555;
        }

        .login-link {
            color: #e57c25;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link:hover {
            color: black;
            opacity: 0.9;
            transition: 0.4s ease;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Welcome Back to</h2>
            <h1>Click to Borrow</h1>
            <p class="subtitle">"Fast, Easy, Reliable – Borrow IT Equipment with a Click!"</p>
            <p>Sign in to see more</p>

            <a href="LoginAsStudent.html" class="btn student-btn">Continue with Student</a>
            <a href="itsolpage.html" class="btn itso-btn">Continue with ITSO</a>

            <p class="login-text">
                Already have an account? <a href="loginpage.html" class="login-link">Log in</a>
            </p>
        </div>
    </div>
</body>
</html>
